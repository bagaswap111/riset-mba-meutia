<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Per-task ease scores with dispersion, showing a ceiling effect in four of eight tasks</title>
<desc id="d">Dot plot of Single Ease Question means for eight tasks on a 1 to 7 scale, each with a plus or minus one standard deviation whisker. Four tasks have standard deviations at or below 0.42 and sit against the top of the scale. The support and contact task has the lowest mean of 5.70 and by far the widest standard deviation of 2.11, spanning ratings from 1 to 7.</desc>
<rect width="900" height="500" fill="#ffffff"/>
<text x="26" y="28" font-size="15.5" font-weight="bold" fill="#1a1a2e">Ease is high on average, but only four tasks can still discriminate</text>
<text x="26" y="47" font-size="11.5" fill="#6b6b6b">Mean Single Ease Question score per task, n = 10 participants per task. Whiskers show ± 1 SD. Overall mean across all 80 ratings = 6.56.</text>
