<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Reproduction status of every price figure recorded during the usability study</title>
<desc id="d">A two-column status chart listing six recorded price observations against the total the prototype's pricing function actually computes. Sessions R08, SEQ-P08 and R03 reported totals of 100.98, 100.98 and 166.86 dollars, each matching the implemented computation exactly. Sessions R05 and R07 reported 198 dollars, which no build can produce. Session R06 reported 75.06 dollars against a computed 69.66. The 198 dollar figure is withdrawn.</desc>
<defs><pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#c1121f" stroke-width="2.4" opacity="0.34"/></pattern></defs>
<rect width="900" height="540" fill="#ffffff"/>
<text x="26" y="28" font-size="15.5" font-weight="bold" fill="#1a1a2e">Reproduction against the prototype source: 4 of 6 recorded totals confirmed, 2 refuted</text>
<text x="26" y="47" font-size="11.5" fill="#6b6b6b">Implemented function, both builds: tax = (price + 4.50) × 0.08; total = price + 4.50 + tax. Every call site delegates to it; none computes inline.</text>

<!-- header row -->
<rect x="26" y="62" width="848" height="26" rx="3" fill="#1a1a2e"/>
<text x="40" y="80" font-size="11.5" font-weight="bold" fill="#ffffff">Session</text>
<text x="150" y="80" font-size="11.5" font-weight="bold" fill="#ffffff">Service</text>
<text x="245" y="80" font-size="11.5" font-weight="bold" fill="#ffffff">Total recorded</text>
<text x="400" y="80" font-size="11.5" font-weight="bold" fill="#ffffff">Code produces</text>
<text x="570" y="80" font-size="11.5" font-weight="bold" fill="#ffffff">Verdict</text>

<!-- confirmed rows -->
<rect x="26" y="90" width="848" height="26" fill="#f2f7f3"/>
<text x="40" y="108" font-size="11.5" fill="#1a1a2e">R08</text>
<text x="150" y="108" font-size="11.5" fill="#1a1a2e">$89.00</text>
<text x="245" y="108" font-size="11.5" fill="#1a1a2e">$100.98</text>
<text x="400" y="108" font-size="11.5" fill="#1a1a2e">$100.98</text>
<text x="570" y="108" font-size="11.5" font-weight="bold" fill="#3f7d58">CONFIRMED — exact</text>

<rect x="26" y="116" width="848" height="26" fill="#ffffff"/>
<text x="40" y="134" font-size="11.5" fill="#1a1a2e">SEQ-P08</text>
<text x="150" y="134" font-size="11.5" fill="#1a1a2e">$89.00</text>
<text x="245" y="134" font-size="11.5" fill="#1a1a2e">$100.98</text>
<text x="400" y="134" font-size="11.5" fill="#1a1a2e">$100.98</text>
<text x="570" y="134" font-size="11.5" font-weight="bold" fill="#3f7d58">CONFIRMED — exact</text>

<rect x="26" y="142" width="848" height="26" fill="#f2f7f3"/>
<text x="40" y="160" font-size="11.5" fill="#1a1a2e">R03</text>
<text x="150" y="160" font-size="11.5" fill="#1a1a2e">$150.00</text>
<text x="245" y="160" font-size="11.5" fill="#1a1a2e">$166.86</text>
<text x="400" y="160" font-size="11.5" fill="#1a1a2e">$166.86</text>
<text x="570" y="160" font-size="11.5" font-weight="bold" fill="#3f7d58">CONFIRMED — exact, different service</text>

<!-- contradicted row -->
<rect x="26" y="168" width="848" height="26" fill="#fdf8f2"/>
<text x="40" y="186" font-size="11.5" fill="#1a1a2e">R06</text>
<text x="150" y="186" font-size="11.5" fill="#1a1a2e">$60.00</text>
<text x="245" y="186" font-size="11.5" fill="#1a1a2e">$75.06</text>
<text x="400" y="186" font-size="11.5" fill="#1a1a2e">$69.66</text>
<text x="570" y="186" font-size="11.5" font-weight="bold" fill="#c1662f">CONTRADICTED — off by $5.40</text>

<!-- refuted rows, hatched -->
<rect x="26" y="194" width="848" height="26" fill="#fdf1f1"/>
<text x="40" y="212" font-size="11.5" fill="#1a1a2e">R05</text>
<text x="150" y="212" font-size="11.5" fill="#1a1a2e">$89.00</text>
<text x="245" y="212" font-size="11.5" fill="#1a1a2e">$198.00</text>
<text x="400" y="212" font-size="11.5" fill="#1a1a2e">$100.98</text>
<text x="570" y="212" font-size="11.5" font-weight="bold" fill="#c1121f">REFUTED — withdrawn</text>

<rect x="26" y="220" width="848" height="26" fill="#fdf1f1"/>
<text x="40" y="238" font-size="11.5" fill="#1a1a2e">R07</text>
<text x="150" y="238" font-size="11.5" fill="#1a1a2e">$89.00</text>
<text x="245" y="238" font-size="11.5" fill="#1a1a2e">$198.00</text>
<text x="400" y="238" font-size="11.5" fill="#1a1a2e">$100.98</text>
<text x="570" y="238" font-size="11.5" font-weight="bold" fill="#c1121f">REFUTED — withdrawn</text>

<line x1="26" y1="246" x2="874" y2="246" stroke="#dcdcdc" stroke-width="1"/>
<rect x="26" y="220" width="848" height="26" fill="url(#hatch)" opacity="0.5"/>

<!-- panel 1: what the code computes at $89 -->
<rect x="26" y="266" width="418" height="118" rx="6" fill="#f2f7f3" stroke="#3f7d58" stroke-width="1.3"/>
<text x="42" y="288" font-size="12" font-weight="bold" fill="#2c5a3e">What the build renders at $89.00</text>
<text x="42" y="310" font-size="11" fill="#33475c">line item        89.00</text>
<text x="42" y="327" font-size="11" fill="#33475c">service fee      4.50</text>
<text x="42" y="344" font-size="11" fill="#33475c">subtotal        93.50   ← the implemented tax base</text>
<text x="42" y="361" font-size="11" fill="#33475c">tax at 8%        7.48</text>
<text x="42" y="378" font-size="12" font-weight="bold" fill="#2c5a3e">total          100.98   ← observed exactly</text>

<!-- panel 2: why 198 is unreachable -->
<rect x="456" y="266" width="418" height="118" rx="6" fill="#fdf1f1" stroke="#c1121f" stroke-width="1.3"/>
<text x="472" y="288" font-size="12" font-weight="bold" fill="#8a0f18">Why $198.00 is unreachable</text>
<text x="472" y="310" font-size="11" fill="#5c3a3a">Absent as a literal constant in either build</text>
<text x="472" y="327" font-size="11" fill="#5c3a3a">or anywhere in the version history.</text>
<text x="472" y="350" font-size="11" fill="#5c3a3a">The recorded $18.00 tax at a stated 8%</text>
<text x="472" y="367" font-size="11" fill="#5c3a3a">implies a base of $225.00 — a $220.50 line item. None exists.</text>
<text x="472" y="378" font-size="11" font-weight="bold" fill="#8a0f18">R05 and R07 reported one coherent but wrong set.</text>

<!-- panel 3: the finding that survived -->
<rect x="26" y="398" width="848" height="122" rx="6" fill="#fdf8f2" stroke="#c1662f" stroke-width="1.3"/>
<text x="42" y="420" font-size="12" font-weight="bold" fill="#7d3d15">The defect the procedure did find — ambiguous tax base</text>
<text x="42" y="442" font-size="11" fill="#5c4a3a">The checkout labels the line &#8220;Tax (8%)&#8221; while computing tax on <tspan font-style="italic">price + fee</tspan>. Both readings are available, and they disagree:</text>
<text x="42" y="464" font-size="11" fill="#5c4a3a">reading 1 — 8% of the line item, 89.00  →  7.12   (does not match the displayed 7.48)</text>
<text x="42" y="481" font-size="11" fill="#5c4a3a">reading 2 — 8% of the subtotal,   93.50  →  7.48   (matches the displayed 7.48)</text>
<text x="42" y="504" font-size="11" font-weight="bold" fill="#7d3d15">The amount is correct; the label does not state its base. Severity High, not Critical. Fix: one string.</text>
</svg>
