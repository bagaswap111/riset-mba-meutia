<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">A displayed total of 198 dollars against line items summing to 111.50 dollars</title>
<desc id="d">Four vertical bars. The correctly computed total for an 89 dollar service at the stated eight percent tax rate is 100.62 dollars, and two other test sessions independently reported 100.98 dollars. The line items as stated by participants sum to 111.50 dollars. The total displayed to the user was 198 dollars, leaving 86.50 dollars unexplained, an excess of 77.6 percent.</desc>
<defs><pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#c1121f" stroke-width="2.4" opacity="0.34"/></pattern></defs>
<rect width="900" height="520" fill="#ffffff"/>
<text x="26" y="28" font-size="15.5" font-weight="bold" fill="#1a1a2e">The displayed total exceeds the sum of its own line items by $86.50</text>
<text x="26" y="47" font-size="11.5" fill="#6b6b6b">Service line item $89.00, service fee $4.50, tax line $18.00 described as 8%. Figures as transcribed from two independent test sessions.</text>
<line x1="96" y1="392.0" x2="846" y2="392.0" stroke="#dcdcdc" stroke-width="1"/>
<text x="86" y="396.0" font-size="10.5" fill="#6b6b6b" text-anchor="end">$0</text>
<line x1="96" y1="323.8" x2="846" y2="323.8" stroke="#dcdcdc" stroke-width="1"/>
<text x="86" y="327.8" font-size="10.5" fill="#6b6b6b" text-anchor="end">$50</text>
<line x1="96" y1="255.6" x2="846" y2="255.6" stroke="#dcdcdc" stroke-width="1"/>
<text x="86" y="259.6" font-size="10.5" fill="#6b6b6b" text-anchor="end">$100</text>
<line x1="96" y1="187.5" x2="846" y2="187.5" stroke="#dcdcdc" stroke-width="1"/>
<text x="86" y="191.5" font-size="10.5" fill="#6b6b6b" text-anchor="end">$150</text>
<line x1="96" y1="119.3" x2="846" y2="119.3" stroke="#dcdcdc" stroke-width="1"/>
<text x="86" y="123.3" font-size="10.5" fill="#6b6b6b" text-anchor="end">$200</text>
<rect x="709.2" y="122.0" width="86" height="118.0" fill="url(#hatch)"/>
<rect x="146.8" y="254.8" width="86" height="137.2" fill="#3f7d58"/>
<text x="189.8" y="245.8" font-size="14" fill="#3f7d58" text-anchor="middle" font-weight="bold">$100.62</text>
<text x="189.8" y="412.0" font-size="10.5" fill="#1a1a2e" text-anchor="middle">Correct total</text>
<text x="189.8" y="425.0" font-size="10.5" fill="#1a1a2e" text-anchor="middle">at the stated 8% rate</text>
<rect x="334.2" y="254.3" width="86" height="137.7" fill="#9a9a9a"/>
<text x="377.2" y="245.3" font-size="14" fill="#9a9a9a" text-anchor="middle" font-weight="bold">$100.98</text>
<text x="377.2" y="412.0" font-size="10.5" fill="#1a1a2e" text-anchor="middle">Observed in two</text>
<text x="377.2" y="425.0" font-size="10.5" fill="#1a1a2e" text-anchor="middle">other sessions</text>
<rect x="521.8" y="240.0" width="86" height="152.0" fill="#c1662f"/>
<text x="564.8" y="231.0" font-size="14" fill="#c1662f" text-anchor="middle" font-weight="bold">$111.50</text>
<text x="564.8" y="412.0" font-size="10.5" fill="#1a1a2e" text-anchor="middle">Sum of the stated</text>
<text x="564.8" y="425.0" font-size="10.5" fill="#1a1a2e" text-anchor="middle">line items</text>
<rect x="709.2" y="122.0" width="86" height="270.0" fill="#c1121f"/>
<text x="752.2" y="113.0" font-size="14" fill="#c1121f" text-anchor="middle" font-weight="bold">$198.00</text>
<text x="752.2" y="412.0" font-size="10.5" fill="#1a1a2e" text-anchor="middle">Total displayed</text>
<text x="752.2" y="425.0" font-size="10.5" fill="#1a1a2e" text-anchor="middle">to the user</text>
<line x1="96" y1="392" x2="846" y2="392" stroke="#1a1a2e" stroke-width="1.4"/>
<line x1="703.2" y1="122.0" x2="703.2" y2="240.0" stroke="#c1121f" stroke-width="1.4"/>
<text x="695.2" y="177.0" font-size="12" fill="#c1121f" font-weight="bold" text-anchor="end">+ $86.50 unexplained</text>
<text x="695.2" y="192.0" font-size="10.5" fill="#c1121f" text-anchor="end">total is 77.6% above the sum of its own line items</text>
<path d="M 803.25 240.0 L 803.25 122.0" stroke="#c1121f" stroke-width="1.2"/>
<rect x="96" y="428" width="750" height="72" rx="6" fill="#fdf1e6" stroke="#c1662f" stroke-width="1.3"/>
<text x="110" y="448" font-size="11.5" font-weight="bold" fill="#7d3d15">The line items are also internally inconsistent</text>
<text x="110" y="466" font-size="11" fill="#5c4a3a">8% of an $89.00 line item is $7.12, not the $18.00 displayed — so either the rate label or the amount is wrong.</text>
<text x="110" y="484" font-size="11" fill="#5c4a3a">Neither reading produces $198.00. Two other sessions independently reported $100.98, within $0.36 of the correct computation.</text>
</svg>