<line x1="16" y1="70" x2="864" y2="70" stroke="#1a1a2e" stroke-width="1.4"/>
<circle cx="36" cy="430" r="8" fill="#39516b"/>
<text x="52" y="434" font-size="10.5" fill="#6b6b6b">flagged by inspection</text>
<circle cx="204" cy="430" r="8" fill="#c1662f"/>
