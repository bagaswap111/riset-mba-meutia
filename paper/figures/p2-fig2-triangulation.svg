<text x="630" y="267" font-size="11" fill="#39516b" font-weight="bold">Convergent</text>
<text x="26" y="311" font-size="11.5" fill="#1a1a2e" font-weight="bold">Postal code silently truncated</text>
<circle cx="426.0" cy="305" r="7" fill="none" stroke="#9a9a9a" stroke-width="1.6" stroke-dasharray="3 2"/>
