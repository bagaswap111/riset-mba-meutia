<text x="414" y="434" font-size="10.5" fill="#6b6b6b">not flagged</text>
<text x="26" y="456" font-size="10.5" fill="#6b6b6b">The two bottom rows are the finding of this paper: neither is a defect in the code, because each value renders exactly as written.</text>
</svg>