<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The eight-task instrument mapped onto the prototype's booking sequence</title>
  <desc id="d">Six sequential screens of a home-services checkout, with task codes T1 to T6 attached to each screen, and two cross-cutting probes T7 (back navigation) and T8 (support and FAQ) shown as bands spanning the whole flow.</desc>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a5a5a"/>
    </marker>
    <pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#c1121f" stroke-width="2.2" opacity="0.30"/>
    </pattern>
  </defs>

  <rect width="900" height="330" fill="#ffffff"/>

  <!-- heading -->
  <text x="24" y="30" font-size="15" font-weight="bold" fill="#1a1a2e">Booking sequence and task coverage</text>
  <text x="24" y="49" font-size="11.5" fill="#6b6b6b">Six sequential screens carry tasks T1–T6; T7 and T8 probe behaviour available from any point in the flow.</text>

  <!-- sequential stage boxes -->
  <g>
    <!-- box 1 -->
    <rect x="30" y="76" width="126" height="86" rx="6" fill="#eef2f7" stroke="#39516b" stroke-width="1.4"/>
    <text x="93" y="96" font-size="10.5" fill="#39516b" text-anchor="middle" font-weight="bold">DISCOVER</text>
    <text x="93" y="118" font-size="21" fill="#1a1a2e" text-anchor="middle" font-weight="bold">T1</text>
    <text x="93" y="136" font-size="10.5" fill="#4a4a4a" text-anchor="middle">find AC service</text>
    <text x="93" y="151" font-size="10.5" fill="#4a4a4a" text-anchor="middle">T2 · find leak service</text>

    <!-- box 2 -->
    <rect x="172" y="76" width="126" height="86" rx="6" fill="#eef2f7" stroke="#39516b" stroke-width="1.4"/>
    <text x="235" y="96" font-size="10.5" fill="#39516b" text-anchor="middle" font-weight="bold">DETAIL</text>
    <text x="235" y="118" font-size="21" fill="#1a1a2e" text-anchor="middle" font-weight="bold">T3</text>
    <text x="235" y="136" font-size="10.5" fill="#4a4a4a" text-anchor="middle">read price</text>
    <text x="235" y="151" font-size="10.5" fill="#4a4a4a" text-anchor="middle">breakdown</text>

    <!-- box 3 -->
    <rect x="314" y="76" width="126" height="86" rx="6" fill="#eef2f7" stroke="#39516b" stroke-width="1.4"/>
    <text x="377" y="96" font-size="10.5" fill="#39516b" text-anchor="middle" font-weight="bold">SCHEDULE</text>
    <text x="377" y="118" font-size="21" fill="#1a1a2e" text-anchor="middle" font-weight="bold">T4</text>
    <text x="377" y="136" font-size="10.5" fill="#4a4a4a" text-anchor="middle">pick date</text>
    <text x="377" y="151" font-size="10.5" fill="#4a4a4a" text-anchor="middle">and slot</text>

    <!-- box 4 -->
    <rect x="456" y="76" width="126" height="86" rx="6" fill="#eef2f7" stroke="#39516b" stroke-width="1.4"/>
    <text x="519" y="96" font-size="10.5" fill="#39516b" text-anchor="middle" font-weight="bold">ADDRESS</text>
    <text x="519" y="118" font-size="21" fill="#1a1a2e" text-anchor="middle" font-weight="bold">T5</text>
    <text x="519" y="136" font-size="10.5" fill="#4a4a4a" text-anchor="middle">complete form</text>
    <text x="519" y="151" font-size="10.5" fill="#4a4a4a" text-anchor="middle">T6 · provoke error</text>

    <!-- box 5 -->
    <rect x="598" y="76" width="126" height="86" rx="6" fill="#eef2f7" stroke="#39516b" stroke-width="1.4"/>
    <text x="661" y="96" font-size="10.5" fill="#39516b" text-anchor="middle" font-weight="bold">PAY</text>
    <text x="661" y="118" font-size="10.5" fill="#4a4a4a" text-anchor="middle">payment method</text>
    <text x="661" y="136" font-size="10.5" fill="#4a4a4a" text-anchor="middle">(simulated;</text>
    <text x="661" y="151" font-size="10.5" fill="#4a4a4a" text-anchor="middle">no card charged)</text>

    <!-- box 6 -->
    <rect x="740" y="76" width="126" height="86" rx="6" fill="#eef2f7" stroke="#39516b" stroke-width="1.4"/>
    <text x="803" y="96" font-size="10.5" fill="#39516b" text-anchor="middle" font-weight="bold">CONFIRM</text>
    <text x="803" y="118" font-size="10.5" fill="#4a4a4a" text-anchor="middle">invoice and</text>
    <text x="803" y="136" font-size="10.5" fill="#4a4a4a" text-anchor="middle">tracking panel</text>
    <text x="803" y="156" font-size="10" fill="#8a8a8a" text-anchor="middle" font-style="italic">no task attached</text>
  </g>

  <!-- flow arrows -->
  <g stroke="#5a5a5a" stroke-width="1.5" marker-end="url(#arw)">
    <line x1="159" y1="119" x2="168" y2="119"/>
    <line x1="301" y1="119" x2="310" y2="119"/>
    <line x1="443" y1="119" x2="452" y2="119"/>
    <line x1="585" y1="119" x2="594" y2="119"/>
    <line x1="727" y1="119" x2="736" y2="119"/>
  </g>

  <!-- cross-cutting band container -->
  <text x="30" y="196" font-size="11.5" font-weight="bold" fill="#1a1a2e">Cross-cutting probes</text>

  <!-- T7 band -->
  <rect x="30" y="206" width="836" height="46" rx="6" fill="#fdf1e6" stroke="#c1662f" stroke-width="1.4"/>
  <rect x="30" y="206" width="46" height="46" rx="6" fill="#c1662f"/>
  <text x="53" y="235" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="bold">T7</text>
  <text x="92" y="225" font-size="12" font-weight="bold" fill="#7d3d15">Navigate back without losing entered data</text>
  <text x="92" y="243" font-size="11" fill="#5c4a3a">Explicit success criterion: no data loss. Tests state persistence across back-navigation and reload.</text>

  <!-- T8 band -->
  <rect x="30" y="262" width="836" height="46" rx="6" fill="#fdeaea" stroke="#c1121f" stroke-width="1.4"/>
  <rect x="30" y="262" width="46" height="46" rx="6" fill="#c1121f"/>
  <text x="53" y="291" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="bold">T8</text>
  <text x="92" y="281" font-size="12" font-weight="bold" fill="#8a0e18">Locate FAQ and contact support</text>
  <text x="92" y="299" font-size="11" fill="#5c3a3a">Tests whether a help channel is discoverable from an ordinary starting point, not only from the footer.</text>
</svg>