<text x="26" y="474" font-size="10.5" fill="#6b6b6b">Red rows are reported by six or more participants in at least one corpus. T6 is split into three sub-items; those counts are</text>
<text x="26" y="489" font-size="10.5" fill="#6b6b6b">not additive with the compound row used in the results table.</text>
<text x="26" y="504" font-size="10.5" fill="#6b6b6b">Currency appears only in the second SEQ round, yet the narrative synthesis asserts a unanimous objection — a disagreement discussed in the text.</text>
